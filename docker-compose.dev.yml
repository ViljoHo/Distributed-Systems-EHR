services:

  redis:
    image: redis:latest
    ports:
      - 6379:6379
    container_name: redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 12

  hospital_1:
    build:
      context: ./hospital
      dockerfile: dev.Dockerfile
    volumes:
      - ./hospital/:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgres://postgres:mysecretpassword@hospital-db-primary:5432/postgres
      - READ_DATABASE_URL=postgres://postgres:mysecretpassword@hospital-db-primary:5432/postgres
      - PORT=3000
      - SECRET=salaisuus
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=hospital-api
      - SERVICE_NUMBER=1
    depends_on:
      hospital-db-primary:
        condition: service_healthy
      redis:
        condition: service_healthy

  hospital_2:
    build:
      context: ./hospital
      dockerfile: dev.Dockerfile
    volumes:
      - ./hospital/:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgres://postgres:mysecretpassword@hospital-db-primary:5432/postgres
      - READ_DATABASE_URL=postgres://postgres:mysecretpassword@hospital-db-replica-1:5432/postgres
      - PORT=3000
      - SECRET=salaisuus
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=hospital-api
      - SERVICE_NUMBER=2
    depends_on:
      hospital-db-primary:
        condition: service_healthy
      hospital-db-replica-1:
        condition: service_healthy
      redis:
        condition: service_healthy

  hospital_3:
    build:
      context: ./hospital
      dockerfile: dev.Dockerfile
    volumes:
      - ./hospital/:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgres://postgres:mysecretpassword@hospital-db-primary:5432/postgres
      - READ_DATABASE_URL=postgres://postgres:mysecretpassword@hospital-db-replica-2:5432/postgres
      - PORT=3000
      - SECRET=salaisuus
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=hospital-api
      - SERVICE_NUMBER=3
    depends_on:
      hospital-db-primary:
        condition: service_healthy
      hospital-db-replica-2:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth:
    build:
      context: ./auth
      dockerfile: dev.Dockerfile
    volumes:
      - ./auth/:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgres://postgres:mysecretpassword@auth-db:5432/postgres
      - PORT=3001
      - SECRET=salaisuus
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=auth-api
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  audit-service:
    build:
      context: ./audit-service
    ports:
      - 5004:5004
    environment:
      - PORT=5004
      - SECRET_KEY=dev
      - DATABASE_URL=postgresql+psycopg2://postgres:mysecretpassword@audit_db:5432/audit_service
      - REDIS_URL=redis://redis:6379
      - AUTH_JWT_SECRET=salaisuus
    command: sh -c "flask --app=audit_api init-db && gunicorn --bind 0.0.0.0:5004 --workers 1 app:app"
    depends_on:
      redis:
        condition: service_healthy
      audit_db:
        condition: service_healthy

  audit_db:
    image: postgres
    ports:
      - 5435:5432
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=audit_service
    volumes:
      - audit_data:/var/lib/postgresql
    container_name: audit-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d audit_service" ]
      interval: 5s
      timeout: 5s
      retries: 12

  hospital-db-primary:
    image: bitnami/postgresql:latest
    ports:
      - 5432:5432
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=mysecretpassword
      - POSTGRESQL_DATABASE=postgres
    volumes:
      - hospital_primary_data:/bitnami/postgresql
    container_name: hospital-db-primary
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 12

  hospital-db-replica-1:
    image: bitnami/postgresql:latest
    ports:
      - 5434:5432
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=hospital-db-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=mysecretpassword
    volumes:
      - hospital_replica_1_data:/bitnami/postgresql
    container_name: hospital-db-replica-1
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      hospital-db-primary:
        condition: service_healthy

  hospital-db-replica-2:
    image: bitnami/postgresql:latest
    ports:
      - 5436:5432
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=hospital-db-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=mysecretpassword
    volumes:
      - hospital_replica_2_data:/bitnami/postgresql
    container_name: hospital-db-replica-2
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      hospital-db-primary:
        condition: service_healthy

  auth-db:
    image: postgres
    ports:
      - 5433:5432
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
    volumes:
      - auth_data:/var/lib/postgresql
    container_name: auth-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:1.20.1
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - hospital_1
      - hospital_2
      - hospital_3
      - auth
      - audit-service

volumes:
  hospital_primary_data:
    name: "hospital-primary-data"
  hospital_replica_1_data:
    name: "hospital-replica-1-data"
  hospital_replica_2_data:
    name: "hospital-replica-2-data"
  auth_data:
    name: "auth-dev-postgres-volume-v2"
  audit_data:
    name: "audit-service-dev-postgres-volume"
