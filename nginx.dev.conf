upstream hospital_backend {
    server hospital_1:3000;
    server hospital_2:3000;
    server hospital_3:3000;
}

server {
    listen 80;

    # Auth service - registration, login, user info
    # Matches /api/v1/auth/* and forwards the full path to auth service
    location /api/v1/auth/ {
        proxy_pass http://auth:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Error handling for service unavailability
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        error_page 502 503 504 /auth_unavailable;
    }

    # Audit service 
    # Matches /api/v1/audit/* and forwards the full path to audit service
    location /api/v1/audit/ {
        proxy_pass http://audit-service:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Error handling for service unavailability
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        error_page 502 503 504 /auth_unavailable;
    }

    # Hospital service - patients, records, business logic
    # Matches /api/v1/* (except /api/v1/auth) and forwards the full path to hospital service
    location /api/v1/ {
        proxy_pass http://hospital_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Error handling for service unavailability
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        error_page 502 503 504 /hospital_unavailable;
    }

    # # Frontend client (if applicable)
    # location / {
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_pass http://client:3000;
    # }

    # Custom error responses
    location = /auth_unavailable {
        internal;
        default_type application/json;
        return 503 '{"error": "auth service unavailable"}';
    }

    location = /hospital_unavailable {
        internal;
        default_type application/json;
        return 503 '{"error": "hospital service unavailable"}';
    }
}